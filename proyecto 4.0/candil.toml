# candil.toml — ropero, traducido a mano
#
# Traducción del Apéndice A de `candil-4.0-final.md`. No lo genera ningún
# comando (C15): los `ropero.d/*.sh` tienen `case` anidados, variables
# indirectas y `source` entre ellos, y un parser que acierta el 80% es peor
# que nada — parece fiable y falla en silencio.
#
# ropero sigue vivo y no se toca (C16). Este fichero no es una migración: es
# la misma configuración, escrita donde Candil pueda leerla.
#
# AJUSTA ESTO ANTES DE USARLO:
#   · `~/.candil` por debajo, si tienes los modelos en otro sitio (C17)
#   · la ruta de `--model-draft` en `model.analyst`: tiene que ser ABSOLUTA.
#     `~` no se expande dentro del argumento de llama-server, porque llega
#     entre comillas al proceso hijo (C22).

[general]
data_dir         = "~/.candil"
log_dir          = "~/.candil/logs"
default_consumer = "default"

[engine.llama_cpp]
binary    = "~/.local/bin/llama-server"
host      = "127.0.0.1"
base_port = 10000

[engine.llama_cpp.install]
strategy  = "source"
repo      = "https://github.com/ggml-org/llama.cpp"
ref       = "b4561"
src_dir   = "~/llama.cpp/"
build_dir = "~/llama.cpp/build/bin"
generator = "ninja"
dir       = "~/.local/bin/llama-server"
binaries  = ["llama-server", "llama-cli"]
# Los flags de TU hardware. Candil no añade ninguno por su cuenta y no debe
# empezar a hacerlo: una RTX 5080 (Blackwell) necesita 120a junto con los
# interruptores MXFP4 y NVFP4, y un binario genérico publicado no está
# ajustado a eso. Quien sabe el hardware es quien escribe este fichero.
#
# macOS/Metal: GGML_METAL_* y -mcpu=native.
# Sin GPU: quita los -DGGML_CUDA* y deja -DGGML_NATIVE=ON.
cmake_args = [
  "-DCMAKE_BUILD_TYPE=Release",
  "-DCUDA_TOOLKIT_ROOT_DIR=/opt/cuda-13.3",
  "-DCMAKE_CUDA_COMPILER=/opt/cuda-13.3/bin/nvcc",
  "-DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-14",
  "-DCMAKE_CXX_COMPILER=/usr/bin/g++-14",
  "-DCMAKE_C_COMPILER=/usr/bin/g++-14/g++/gcc",
  "-DCMAKE_CXX_FLAGS=-march=native -O3 -ftree-vectorize",
  "-DCMAKE_C_FLAGS=-march=native -O3 -ftree-vectorize",
  "-DCMAKE_CUDA_FLAGS=--use_fast_math -O3 -lineinfo",
  "-DCMAKE_CUDA_ARCHITECTURES=120a",
  "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON",
  "-DGGML_CUDA_MMQ_MXFP4=ON",
  "-DGGML_CUDA_MMQ_NVFP4=ON",
  "-DGGML_CUDA=ON",
  "-DGGML_CUDA_FA=ON",
  "-DGGML_CUDA_FA_QUANTS=ON",
  "-DGGML_CUDA_GRAPHS=ON",
  "-DGGML_CUDA_FORCE_MMQ=OFF",
  "-DGGML_CUDA_FORCE_CUBLAS=OFF",
  "-DGGML_CUDA_F16=OFF",
  "-DGGML_CUDA_NO_VMM=ON",
  "-DGGML_CUDA_COMPRESSION_MODE=speed",
  "-DGGML_RPC=ON",
  "-DGGML_OPENMP=ON",
  "-DGGML_NATIVE=ON",
  "-DGGML_AVX2=ON",
  "-DGGML_AVX512=ON",
  "-DGGML_AVX512_VBMI=ON",
  "-DGGML_AVX512_VNNI=ON",
  "-DGGML_AVX512_BF16=ON",
  "-DGGML_AVX512_FP16=ON",
  "-DGGML_FMA=ON",
  "-DLLAMA_OPENSSL=ON",
  "-DBUILD_SHARED_LIBS=OFF",
  "-DLLAMA_BUILD_SERVER=ON",
  "-DLLAMA_BUILD_TOOLS=ON",
  "-DLLAMA_BUILD_EXAMPLES=OFF",
  "-DLLAMA_BUILD_TESTS=OFF",
  "-DLLAMA_BUILD_UI=OFF",
  "-DLLAMA_BUILD_EXTRA=ON" 
]

[engine.llama_cpp.auth]
api_key_env = "LLAMA_API_KEY"

# ── ropero.d/qwencoder.sh ──────────────────────────────────────────────
[model.coder]
type         = "local"
engine       = "llama_cpp"
context_size = 131072
port         = 9999
usage        = ["chat", "code", "completion"]
tags         = ["gpu", "moe", "code"]
model_args   = ["--alias", "qwencoder", "-fa", "on",
                "--log-verbosity", "3",
                "--n-gpu-layers", "-1",
                "--n-cpu-moe", "30",
                "--cache-type-k", "q8_0",
                "--cache-type-v", "q8_0",
                "--cache-prompt", "--context-shift",
                "--kv-unified", "--jinja",
                "--reasoning-format", "deepseek",
                "--load-mode", "none",
                "--temp", "0.7", "--top-p", "0.8",
                "--top-k", "20", "--min-p", "0.0",
                "--repeat-penalty", "1.05",
                "--repeat-last-n", "64",
                "--batch-size", "4096", "--ubatch-size", "1024",
                "--parallel", "1", "--n-predict", "8192", "--keep", "1024"]
[model.coder.source]
kind = "huggingface"
repo = "unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF"
file = "Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf"
dest = "~/models/gguf"

# ── ropero.d/qwen.sh ───────────────────────────────────────────────────
[model.analyst]
type         = "local"
engine       = "llama_cpp"
context_size = 131072
port         = 9999
usage        = ["chat", "reasoning"]
tags         = ["gpu", "mtp"]
# ⚠ OJO (C22): --model-draft necesita RUTA ABSOLUTA. "~" no se expande dentro
# de las comillas del argumento, porque el proceso hijo lo recibe literal.
model_args   = ["--n-gpu-layers","99", "--no-kv-offload",
                "--spec-type","draft-mtp",
                "--model-draft","/home/lorenzo/models/gguf/mtp-Qwen3.8-27B-Q4_0.gguf",
                "--n-gpu-layers-draft","-1",
                "--spec-draft-n-max","5", "--spec-draft-n-min","1",
                "--spec-draft-backend-sampling",
                "--cache-type-k","q8_0", "--cache-type-v","q8_0",
                "--cache-prompt", "--context-shift", "--kv-unified",
                "--jinja", "--reasoning-format","deepseek",
                "--chat-template-kwargs",'{"enable_thinking": false}',
                "--load-mode","none", "--temp","0.7", "--top-p","0.8",
                "--top-k","20", "--min-p","0.0",
                "--presence-penalty","1.5", "--repeat-penalty","1.0",
                "--repeat-last-n","64", "--batch-size","4096",
                "--ubatch-size","1024", "--parallel","1",
                "--n-predict","16384", "--keep","1024"]
[model.analyst.source]
kind = "huggingface"
repo = "unsloth/Qwen3.8-27B-GGUF"
file = "Qwen3.8-27B-UD-Q3_K_XL.gguf"
dest = "~/models/gguf"
# El draft va aparte: dest_name aplana el subdirectorio MTP/ que deja HF.
[model.analyst.draft]
kind      = "huggingface"
repo      = "unsloth/Qwen3.8-27B-GGUF"
file      = "MTP/mtp-Qwen3.8-27B-Q4_0.gguf"
dest      = "~/models/gguf"
dest_name = "mtp-Qwen3.8-27B-Q4_0.gguf"

# ── ropero.d/gptoss_high.sh ────────────────────────────────────────────
[model.verifier]
type         = "local"
engine       = "llama_cpp"
context_size = 131072
port         = 9998
usage        = ["chat", "reasoning"]
tags         = ["cpu", "reasoning"]
model_args   = ["--n-gpu-layers","99", "--temp","0.8", "--top-k","40",
                "--min-p","0.05", "--repeat-penalty","1.1",
                "--threads","12", "--threads-batch","24",
                "--reasoning-format","auto",
                "--chat-template-kwargs",'{"reasoning_effort":"high"}',
                "--batch-size","4096", "--ubatch-size","1024",
                "--n-predict","16384", "--slot-prompt-similarity","0.2",
                "--keep","8192", "--cache-type-k","q8_0",
                "--cache-type-v","q8_0", "--jinja", "--kv-unified",
                "--load-mode","auto", "--spec-type","ngram-simple",
                "--spec-ngram-simple-size-n","6",
                "--spec-ngram-simple-size-m","16",
                "--spec-ngram-n-min","1", "--spec-ngram-n-max","2"]
[model.verifier.source]
kind = "huggingface"
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
dest = "~/models/gguf"

# designer = verifier con "reasoning_effort":"medium"
[model.designer]
type         = "local"
engine       = "llama_cpp"
context_size = 131072
port         = 9998
usage        = ["chat", "reasoning"]
tags         = ["cpu", "reasoning"]
model_args   = ["--n-gpu-layers","99", "--temp","0.8", "--top-k","40",
                "--min-p","0.05", "--repeat-penalty","1.1",
                "--threads","12", "--threads-batch","24",
                "--reasoning-format","auto",
                "--chat-template-kwargs",'{"reasoning_effort":"medium"}',
                "--batch-size","4096", "--ubatch-size","1024",
                "--n-predict","16384", "--slot-prompt-similarity","0.2",
                "--keep","8192", "--cache-type-k","q8_0",
                "--cache-type-v","q8_0", "--jinja", "--kv-unified",
                "--load-mode","auto", "--spec-type","ngram-simple",
                "--spec-ngram-simple-size-n","6",
                "--spec-ngram-simple-size-m","16",
                "--spec-ngram-n-min","1", "--spec-ngram-n-max","2"]
[model.designer.source]
kind = "huggingface"
repo = "bartowski/openai_gpt-oss-20b-GGUF-MXFP4-Experimental"
file = "openai_gpt-oss-20b-MXFP4.gguf"
dest = "~/models/gguf"

# ── ropero.d/devstral.sh ───────────────────────────────────────────────
[model.coder_lite]
type         = "local"
engine       = "llama_cpp"
context_size = 131072
port         = 9999
usage        = ["chat", "completion"]
tags         = ["gpu"]
model_args   = ["--n-gpu-layers","-1", "--no-kv-offload",
                "--cache-type-k","q8_0", "--cache-type-v","q8_0",
                "--cache-prompt", "--cache-reuse","512",
                "--kv-unified", "--context-shift",
                "--batch-size","4096", "--ubatch-size","1024",
                "--parallel","1", "--threads","12",
                "--threads-batch","16", "--poll","30", "--jinja",
                "--chat-template-kwargs",'{"enable_thinking": false}',
                "--reasoning-format","deepseek", "--temp","0.6",
                "--top-k","20", "--top-p","0.95", "--min-p","0.05",
                "--repeat-penalty","1.0", "--repeat-last-n","64",
                "--seed","-1", "--n-predict","4096", "--keep","1024",
                "--load-mode","none"]
[model.coder_lite.source]
kind = "huggingface"
repo = "unsloth/Devstral-Small-2-24B-Instruct-2512-GGUF"
file = "Devstral-Small-2-24B-Instruct-2512-UD-Q4_K_XL.gguf"
dest = "~/models/gguf"

# ── ropero.d/embed.sh ──────────────────────────────────────────────────
[model.embed]
type         = "local"
engine       = "llama_cpp"
context_size = 8192
port         = 9990
usage        = ["embeddings"]
tags         = ["embed"]
model_args   = ["--embedding", "--pooling","last",
                "--embd-normalize","2", "--batch-size","1024",
                "--ubatch-size","1024", "--parallel","4", "--jinja"]
[model.embed.source]
kind = "huggingface"
repo = "jinaai/jina-code-embeddings-1.5b-GGUF"
file = "jina-code-embeddings-1.5b-Q8_0.gguf"
dest = "~/models/gguf"

# ── Remotos ────────────────────────────────────────────────────────────
[model.gpt4o]
type         = "remote"
name         = "gpt-4o"
provider     = "openai"
context_size = 128000
usage        = ["chat", "completion"]

[provider.openai]
type     = "openai"
base_url = "https://api.openai.com"
api_key  = { env = "OPENAI_API_KEY" }

# ── Consumidores ───────────────────────────────────────────────────────
[consumer.default]
model_default = "coder"

[consumer.posadero]
model_default = "embed"

[consumer.opencode]
model_default = "coder"
