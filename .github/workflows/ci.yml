name: CI

on:
  push:
    branches: [main, 4.0, "4.0/**"]
  pull_request:
    branches: [main, 4.0, "4.0/**"]
  workflow_dispatch:
  schedule:
    # Monday 06:00 UTC. Catches upstream breakage in the GitHub-sourced deps
    # (apero / arrea / trebejo / alaja / botica all track main @ HEAD, so a
    # push to any of them can break us without touching this repo).
    - cron: "0 6 * * 1"

env:
  OTP_VERSION: "28.5.0.7"
  ELIXIR_VERSION: "1.19.5-otp-28"
  MIX_ENV: "test"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Format + lint + audit — fast feedback, no compile of test env
  # ---------------------------------------------------------------------------
  lint:
    name: Format, Lint & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Dialyzer and Credo both want history for accurate diffs.
          fetch-depth: 0

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-mix-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      # `mix format --check-formatted` is a separate gate from compile: a
      # mis-indented file compiles fine and only shows up in review.
      - name: Check formatting
        run: mix format --check-formatted

      # Credo was previously commented out because strict mode rejected style
      # choices in legacy modules. That debt is now paid (see phase 0), so the
      # gate is back on.
      #
      # oneline, not the `github` format: on 1.7.12 `--format=github` silently
      # falls back to the default output and emits no ::warning annotations, so
      # the diff is not annotated. oneline is compact in the log and is what
      # the developers run locally anyway.
      # SIN `--strict`. Ese flag sube *todos* los checks a `:high`, incluidos
      # los de legibilidad como `NestedModules` («este modulo anidado podria
      # aliasearse arriba»), y el gate caia con cuarenta `[D]` sin senalar un
      # problema real. `--strict` pisa ademas el `exit_status` de la config.
      #
      # La severidad la pone `.credo.exs`: los F y W rompen, los D y I no.
      # Que la lista de checks sea explicita —y no el default— es lo que hace
      # que se pueda decidir eso.
      - name: Credo
        run: mix credo --format=oneline

      - name: Security audit
        run: mix hex.audit

      - name: Unused dependencies
        run: mix deps.unlock --check-unused

  # ---------------------------------------------------------------------------
  # 2. Compile + test — the main quality gate
  # ---------------------------------------------------------------------------
  test:
    name: Compile & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-mix-build-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-build-${{ env.MIX_ENV }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors --force

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        # SIN `--cover`, y a proposito.
        #
        # La cobertura mide una cosa distinta de lo que este gate tiene que
        # atrapar. `format`, `compile`, `credo` y `test` se caen señalando un
        # fichero, y eso es lo que hace que un rojo del CI signifique "mira
        # aqui". Un umbral de cobertura se cae diciendo "el numero bajo", que no
        # señala codigo, y obliga a una conversacion sobre si 50 es el numero
        # correcto para un repo que esta a medio camino.
        #
        # Un gate que se puede caer sin señalar nada es un gate que se apaga.
        run: mix test

      # The gates above all pass on a binary that is broken. This step is the
      # one that would have caught it.
      #
      # `candil run` with no arguments raised a FunctionClauseError, `candil
      # help` did not list `run`/`stop`/`status`, and `candil version` said
      # 3.0.0 — for four releases, with 702 tests green, because nothing here
      # ever built the escript. A library test suite is not a product test.
      - name: Build the escript
        run: mix escript.build

      - name: Smoke the CLI
        run: |
          set -eu
          # Every command has to answer, and none may raise. `--help` on the
          # bare binary is the first thing a new user types.
          ./candil --help
          ./candil version
          ./candil doctor --json > /dev/null

          # A missing *required* argument is a usage error and the DSL answers
          # it with exit status 1. `set -e` is what used to hide this: it turned
          # "the usage error exits non-zero" into "the CI step failed", which is
          # the same shape of problem the smoke test exists to catch. So the
          # status and the message are asserted, not left to `set -e`.
          #
          # Only `run` has a required argument. `stop` without one means "stop
          # everything" and `status` takes none — those are successes, and
          # treating them as failures would be a gate that cries wolf.
          out=$(./candil run 2>&1) && rc=0 || rc=$?
          echo "candil run -> $rc"
          [ "$rc" -ne 0 ] || { echo "::error::run without a model should exit non-zero"; exit 1; }
          case "$out" in
            *'** ('*) echo "::error::run raised instead of printing usage"; exit 1 ;;
            *) ;;
          esac
          echo "$out" | grep -q 'model' \
            || { echo "::error::run did not name the argument it wants"; exit 1; }

          # `status` responde si HAY motores y, si no hay, tambien responde
          # (dice "no hay instancias", rc 0). Lo que NO puede pasar es que
          # levante. Como es el unico comando que depende del estado de la
          # maquina —y el runner es una maquina nueva cada vez— se acepta tanto
          # rc 0 como el rc de "no pude hablar con los engines", y se exige solo
          # que responda y no levante.
          #
          # Antes este era un `./candil status` a pelo con `set -e`: si un dia
          # un runner tiene algo a medias, el CI cae por un comando que no
          # garantiza NADA sobre el producto.
          status_out=$(./candil status 2>&1) || true
          case "$status_out" in
            *'** ('*) echo "::error::status raised instead of answering"; exit 1 ;;
            *) ;;
          esac
          echo "candil status answered"

      - name: The help must list every command the dispatch table has
        run: |
          set -eu
          # The help is an `Alaja.Components.Table` now, so a row starts with a
          # box-drawing character and not with two spaces. Strip the leading run
          # of non-letters and take the first word: that is the command name.
          #
          # `[^a-zA-Z]` and not `[^a-z]`: the latter also eats capital letters,
          # so the header row gave `ommand` and the usage line gave `sage` — two
          # fake commands that a `grep -qx` would never match and nobody would
          # notice until the check silently stopped proving anything. The
          # invariant is unchanged: the rendered help still has to list every
          # command the dispatch table can reach.
          shown=$(./candil --help | sed 's/^[^a-zA-Z]*//' | grep -oE '^[a-z]+' | sort -u)
          # `mix run -e` NO imprime el valor de retorno. Sin este `IO.puts`,
          # `$(...)` queda VACIO, el bucle no se ejecuta NINGUNA vez, el
          # `for` sale con 0 y el gate dice "verde" sin haber comprobado nada.
          # Un `rc=0` de `mix run` enmascaraba que no habia comprobado nada.
          for cmd in $(mix run -e 'IO.puts(Candil.CLI.command_names() |> Enum.join(" "))'); do
            echo "$shown" | grep -qx "$cmd" \
              || { echo "::error::'$cmd' is dispatchable but missing from the help"; exit 1; }
          done
          echo "help lists: $(echo $shown | tr '\n' ' ')"

  # ---------------------------------------------------------------------------
  # 3. Dialyzer — the slowest gate. Its own job with its own PLT cache so a
  #    type change does not serialise behind the test suite.
  # ---------------------------------------------------------------------------
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Cache PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --force

      - name: Build PLT
        run: mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer --no-check

  # ---------------------------------------------------------------------------
  # 4. Docs — `mix docs` must build without warnings. Catches broken @moduledoc
  #    references and stale module lists in `docs/groups_for_modules`, which
  #    ExDoc turns into silent dead links once a module is renamed.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      # The workflow sets MIX_ENV=test globally, and ex_doc is declared
      # `only: :dev`. In test there is no docs task at all — `mix docs` fails
      # with "The task \"docs\" could not be found", which reads like a broken
      # project rather than a mis-scoped env.
      - name: Build in the dev env
        run: echo "MIX_ENV=dev" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      # `mix docs` exits 0 even with warnings, so the flag is the whole point
      # of this step. It catches broken @moduledoc references and stale module
      # lists in groups_for_modules, which ExDoc otherwise turns into silent
      # dead links.
      - name: Build docs (warnings are errors)
        run: mix docs --warnings-as-errors

      - uses: actions/upload-artifact@v4
        with:
          name: exdoc
          path: doc
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 5. Deps-in-sync — the GitHub deps track main @ HEAD, so a breaking change
  #    lands here first. This job answers "is main still installable?".
  # ---------------------------------------------------------------------------
  deps-sync:
    name: Deps In Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install OTP & Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
